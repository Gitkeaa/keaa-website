<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KEAA International | Manufacturer &amp; Exporter of Scaffolding, Formwork &amp; Industrial Solutions</title>
    <meta
      name="description"
      content="KEAA International Pvt. Ltd. ISO 9001:2015 certified manufacturer and exporter of scaffolding systems, formwork accessories, safety products, livestock housing solutions and garden hardware. Exporting to 30+ countries since 2003."
    />
    <!--
      NO FONT CDN LINKS AND NO THIRD-PARTY PRECONNECTS HERE — deliberately.

      Satoshi (Fontshare/ITF) and JetBrains Mono (Google Fonts) used to load from <link>
      tags at this point. Head links fire during HTML parse, before any script and long
      before the consent bar exists, so each one disclosed every visitor's IP to a third
      country with no consent and no possible gate. Both families are now served from
      /fonts/ via @font-face in src/index.css — see the block at the top of that file.

      Anything added here that points at another origin reintroduces exactly that problem.
      Host it, or gate it behind consent inside the app where a gate can actually run.

      Satoshi ships no 600 weight, so `font-semibold` resolves upward to 700.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/satoshi-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/satoshi-700.woff2" crossorigin />
    <link rel="canonical" href="https://www.keaainternational.com/" />
    <meta property="og:site_name" content="KEAA International" />
    <meta property="og:locale" content="en_US" />
    <!--
      The Unsplash hero preload that sat here is removed for the same reason as the font
      links: a head preload fires before any script, so it front-loaded a request to
      images.unsplash.com — and the visitor's IP — on every page load, un-gateable.

      This only ever preloaded the hero's FALLBACK image; the hero's real source is the
      local /images/hero2.jpg, so nothing that normally renders lost its preload. The
      remaining Unsplash usages in src/data/images.js should move to the Cloudinary account
      the site already uses.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "KEAA International Pvt. Ltd.",
        "alternateName": "KEAA International",
        "url": "https://www.keaainternational.com",
        "logo": "https://www.keaainternational.com/favicon.svg",
        "foundingDate": "2003",
        "description": "ISO 9001:2015 certified manufacturer and exporter of scaffolding systems, formwork accessories, safety products, livestock housing solutions and garden hardware.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Village Bhagwanpura, Dehlon Road",
          "addressLocality": "Ludhiana",
          "addressRegion": "Punjab",
          "postalCode": "141120",
          "addressCountry": "IN"
        },
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "telephone": "+91-98767-01926",
            "contactType": "sales",
            "email": "raveesh@keaa-international.net"
          }
        ],
        "sameAs": []
      }
    </script>
    <!--
      WebSite entity, so Google can attribute the site name rather than guessing it from
      the <title>. There is deliberately NO potentialAction/SearchAction here: the product
      catalogue's search is client-side component state and is not addressable by URL, so
      advertising a search endpoint would point crawlers at a page that cannot honour the
      query. Add it only if search ever becomes a real ?q= route.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "KEAA International",
        "alternateName": "KEAA International Pvt. Ltd.",
        "url": "https://www.keaainternational.com",
        "inLanguage": "en",
        "publisher": {
          "@type": "Organization",
          "name": "KEAA International Pvt. Ltd.",
          "url": "https://www.keaainternational.com"
        }
      }
    </script>
  </head>
  <body class="bg-surface text-ink font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
